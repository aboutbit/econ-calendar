name: Generate Econ Calendar

on:
  schedule:
    - cron: '0 21 * * *'   # 매일 밤 9PM UTC = 6AM KST
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: econ-calendar

      - uses: actions/checkout@v4
        with:
          repository: aboutbit/workflow
          ssh-key: ${{ secrets.WORKFLOW_DEPLOY_KEY }}
          path: workflow

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate dashboard
        env:
          GITHUB_ACTIONS: 'true'
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ECON_OUTPUT_DIR: ${{ github.workspace }}/econ-calendar
        run: node workflow/execution/econ-calendar/index.js

      - name: Commit & push
        run: |
          cd econ-calendar
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || (git commit -m "chore: update $(date -u '+%Y-%m-%d')" && git push)
