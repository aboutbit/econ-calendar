name: Generate Econ Calendar

on:
  schedule:
    - cron: '0 21 * * *'   # 매일 밤 9PM UTC = 6AM KST
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: econ-calendar
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4
        with:
          repository: aboutbit/workflow
          ssh-key: ${{ secrets.WORKFLOW_DEPLOY_KEY }}
          path: workflow

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 캐시: node_modules ──────────────────────────────
      - uses: actions/cache@v4
        id: npm-cache
        with:
          path: workflow/execution/econ-calendar/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('workflow/execution/econ-calendar/package.json') }}

      # ── 캐시: Playwright 브라우저 바이너리 ───────────────
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('workflow/execution/econ-calendar/package.json') }}

      # npm: 캐시 미스 시에만 설치
      - name: Install npm packages
        if: steps.npm-cache.outputs.cache-hit != 'true'
        working-directory: workflow/execution/econ-calendar
        run: npm install

      # Playwright 브라우저: 캐시 미스 시 전체 설치 (바이너리 + OS 의존성)
      - name: Install Playwright + system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: workflow/execution/econ-calendar
        run: npx playwright install chromium --with-deps

      # Playwright 브라우저: 캐시 히트 시 OS 의존성만 설치 (바이너리는 캐시에서)
      - name: Install Playwright system deps only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: workflow/execution/econ-calendar
        run: npx playwright install-deps chromium

      - name: Generate dashboard
        env:
          GITHUB_ACTIONS: 'true'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ECON_OUTPUT_DIR: ${{ github.workspace }}/econ-calendar
        run: node workflow/execution/econ-calendar/index.js

      - name: Commit & push
        run: |
          cd econ-calendar
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || (git commit -m "chore: update $(date -u '+%Y-%m-%d')" && git push)
